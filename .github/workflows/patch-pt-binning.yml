name: Match dimuon pT validation binning

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/patch-pt-binning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match dy_bkg_estimation pT binning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("dilepton_pt_validation.py")
          text = path.read_text()

          old_import = "import sys\nfrom typing import List, Tuple\n"
          new_import = "import sys\nfrom array import array\nfrom typing import List, Tuple\n"
          if text.count(old_import) != 1:
              raise RuntimeError("Import anchor not found exactly once")
          text = text.replace(old_import, new_import, 1)

          anchor = 'MG_DY_FILE = "NIsoMuon_DYJets_MG_Inclusive.root"\n'
          replacement = anchor + 'DILEPTON_PT_BINS = (50.0, 100.0, 120.0, 150.0, 200.0, 300.0, 600.0, 1000.0)\n'
          if text.count(anchor) != 1:
              raise RuntimeError("MG_DY_FILE anchor not found exactly once")
          text = text.replace(anchor, replacement, 1)

          pattern = re.compile(
              r'def rebin_hist\(hist, factor: int, name: str\):\n'
              r'    if factor <= 1:\n'
              r'        return clone_hist\(hist, name\)\n'
              r'    out = hist\.Rebin\(factor, name\)\n'
              r'    out\.SetDirectory\(0\)\n'
              r'    out\.Sumw2\(\)\n'
              r'    return out\n'
          )
          new_func = '''def rebin_dilepton_pt(hist, name: str):
              """Use exactly the Dilepton_pT binning from dy_bkg_estimation.py."""
              edges = array("d", DILEPTON_PT_BINS)
              out = hist.Rebin(len(edges) - 1, name, edges)
              out.SetDirectory(0)
              out.Sumw2()
              return out
          '''.replace("              ", "    ")
          text, n = pattern.subn(new_func, text, count=1)
          if n != 1:
              raise RuntimeError(f"Expected one rebin_hist definition, replaced {n}")

          old_data = '    h_data = rebin_hist(h_data_raw, args.rebin, f"data_rebin_{object_token}")'
          new_data = '    h_data = rebin_dilepton_pt(h_data_raw, f"data_rebin_{object_token}")'
          if text.count(old_data) != 1:
              raise RuntimeError("Data rebin call not found exactly once")
          text = text.replace(old_data, new_data, 1)

          old_mc = '        h_mc = rebin_hist(h_raw, args.rebin, f"{label}_rebin_{object_token}")'
          new_mc = '        h_mc = rebin_dilepton_pt(h_raw, f"{label}_rebin_{object_token}")'
          if text.count(old_mc) != 1:
              raise RuntimeError("MC rebin call not found exactly once")
          text = text.replace(old_mc, new_mc, 1)

          old_xmin = '        default=0.0,\n        help="Minimum dimuon pT shown",'
          new_xmin = '        default=DILEPTON_PT_BINS[0],\n        help="Minimum dimuon pT shown",'
          if text.count(old_xmin) != 1:
              raise RuntimeError("xmin default not found exactly once")
          text = text.replace(old_xmin, new_xmin, 1)

          old_xmax = '        default=1000.0,\n        help="Maximum dimuon pT shown",'
          new_xmax = '        default=DILEPTON_PT_BINS[-1],\n        help="Maximum dimuon pT shown",'
          if text.count(old_xmax) != 1:
              raise RuntimeError("xmax default not found exactly once")
          text = text.replace(old_xmax, new_xmax, 1)

          rebin_arg_pattern = re.compile(
              r'    parser\.add_argument\(\n'
              r'        "--rebin",\n'
              r'        type=int,\n'
              r'        default=1,\n'
              r'        help="Integer rebin factor for the 1D pT histogram",\n'
              r'    \)\n'
          )
          text, n = rebin_arg_pattern.subn('', text, count=1)
          if n != 1:
              raise RuntimeError(f"Expected one --rebin parser block, removed {n}")

          check_pattern = re.compile(
              r'    if args\.rebin < 1:\n'
              r'        raise ValueError\("--rebin must be >= 1"\)\n'
          )
          text, n = check_pattern.subn('', text, count=1)
          if n != 1:
              raise RuntimeError(f"Expected one --rebin validation, removed {n}")

          if "rebin_hist(" in text or "args.rebin" in text:
              raise RuntimeError("Old integer rebinning logic still present")

          path.write_text(text)
          PY

          python3 -m py_compile dilepton_pt_validation.py
          rm -f .github/workflows/patch-pt-binning.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dilepton_pt_validation.py .github/workflows/patch-pt-binning.yml
          git commit -m "Match dimuon pT validation binning to DY estimator"
          git push origin HEAD:master
