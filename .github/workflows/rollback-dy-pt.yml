name: Roll back DY pT validation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/rollback-dy-pt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DY file and remove pT validation plots
        shell: bash
        run: |
          set -euo pipefail
          git checkout f4add864b3182ec6b233c421efeafdfec7e0836e -- dy_bkg_estimation.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dy_bkg_estimation.py")
          lines = path.read_text().splitlines(keepends=True)

          def remove_draw_call(token: str) -> None:
              matches = [i for i, line in enumerate(lines) if token in line]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one {token!r}, found {len(matches)}")
              idx = matches[0]
              start = idx
              while start >= 0 and "draw_validation_plot(" not in lines[start]:
                  start -= 1
              end = idx
              while end < len(lines) and lines[end].strip() != ")":
                  end += 1
              if start < 0 or end >= len(lines):
                  raise RuntimeError(f"Could not locate full draw_validation_plot call for {token!r}")
              del lines[start:end + 1]

          remove_draw_call('f"Validation_{args.era}_{args.tf_param}_BJet"')
          remove_draw_call('f"Validation_{args.era}_{args.tf_param}_LightJet"')

          text = "".join(lines)
          old_comment = (
              "    # TF mode keeps the parameter and mass validation plots based on TH2.\n"
              "    # NF mode makes only the B-jet and light-jet mass validation plots and\n"
              "    # reads the one-dimensional Dilepton_Mass histograms directly.\n"
          )
          new_comment = (
              "    # Both TF and NF modes make only B-jet and light-jet dimuon-mass\n"
              "    # validation plots. Dilepton_pT validation is handled separately by\n"
              "    # dilepton_pt_validation.py. TF mode uses TH2 mass projections, while\n"
              "    # NF mode reads the one-dimensional Dilepton_Mass histograms directly.\n"
          )
          if text.count(old_comment) != 1:
              raise RuntimeError(f"Expected exactly one validation comment block, found {text.count(old_comment)}")
          text = text.replace(old_comment, new_comment, 1)

          old_print = '        print("[INFO] Generating TF validation plots from 2D projections...")'
          new_print = '        print("[INFO] Generating TF mass validation plots from 2D projections...")'
          if text.count(old_print) != 1:
              raise RuntimeError(f"Expected exactly one TF validation print, found {text.count(old_print)}")
          text = text.replace(old_print, new_print, 1)

          if f'Validation_{{args.era}}_{{args.tf_param}}_BJet' in text:
              raise RuntimeError("B-jet pT validation call still present")
          if f'Validation_{{args.era}}_{{args.tf_param}}_LightJet' in text:
              raise RuntimeError("Light-jet pT validation call still present")

          path.write_text(text)
          PY

          python3 -m py_compile dy_bkg_estimation.py
          rm -f .github/workflows/rollback-dy-pt.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dy_bkg_estimation.py .github/workflows/rollback-dy-pt.yml
          git commit -m "Remove dimuon pT validation from DY estimator"
          git push origin HEAD:master
