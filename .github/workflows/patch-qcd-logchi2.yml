name: One-shot QCD log-chi2 patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/patch-qcd-logchi2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch qcd_bkg_estimation.py
        run: python .github/patch_qcd_logchi2.py

      - name: Syntax and CLI validation
        run: |
          python -m py_compile qcd_bkg_estimation.py
          python qcd_bkg_estimation.py > /tmp/qcd_help.txt
          grep -q -- "--fit-objective" /tmp/qcd_help.txt

      - name: Commit patched fitter
        run: |
          if git diff --quiet -- qcd_bkg_estimation.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qcd_bkg_estimation.py
          git commit -m "Stabilize QCD log-chi2 fits and adjust plot labels"
          git push origin HEAD:master
